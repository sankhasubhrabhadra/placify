<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mock Interviews - Placify</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="style-additions.css" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="layout-wrapper">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <i data-lucide="code-2" class="text-primary mr-2"></i>
        Placify
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </a>
        <a href="problems.html" class="nav-item">
          <i data-lucide="code-2"></i>
          <span>Problems</span>
        </a>
        <a href="learning.html" class="nav-item">
          <i data-lucide="book-open"></i>
          <span>Learning Paths</span>
        </a>
        <a href="interviews.html" class="nav-item active">
          <i data-lucide="message-square"></i>
          <span>Mock Interviews</span>
        </a>
        <a href="jobs.html" class="nav-item">
          <i data-lucide="file-search"></i>
          <span>Resume Scanner</span>
        </a>
        <a href="simulator.html" class="nav-item">
          <i data-lucide="sparkles"></i>
          <span>Skill Simulator</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="settings.html" class="nav-item">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </a>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-content">
      
      <!-- Top Nav -->
      <header class="top-nav">
        <div class="search-bar">
          <i data-lucide="search" class="text-secondary"></i>
          <input type="text" placeholder="Search problems, articles, or users..." />
        </div>
        <div class="user-actions">
          <button class="icon-btn">
            <i data-lucide="bell"></i>
          </button>
          <a href="#" class="avatar" style="text-decoration: none;">P</a>
        </div>
      </header>

      <!-- Content -->
      <main class="content-area">
        <div class="dashboard-grid">
          <div class="flex justify-between items-center mb-4">
            <h2 class="card-title" style="font-size: 1.5rem;">Mock Interviews</h2>
            <button class="btn btn-primary" onclick="openScheduleModal()">Schedule Interview</button>
          </div>

          <div class="grid grid-cols-2 gap-6">
            <!-- Upcoming -->
            <div class="card">
              <div class="flex items-center gap-2 mb-4 pb-3 border-b">
                <i data-lucide="calendar" class="text-primary"></i>
                <h3 class="card-title">Upcoming</h3>
              </div>
              
              <div class="flex-col gap-4" id="upcoming-container">
                <!-- Populated by JS -->
              </div>
            </div>

            <!-- Past Feedback -->
            <div class="card">
              <div class="flex items-center gap-2 mb-4 pb-3 border-b">
                <i data-lucide="history" class="text-secondary"></i>
                <h3 class="card-title">Past Interviews</h3>
              </div>
              
              <div class="flex-col gap-4" id="past-container">
                <!-- Populated by JS -->
              </div>
            </div>

          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="script.js"></script>

  <!-- Schedule Interview Modal -->
  <div id="scheduleModal" class="modal-overlay">
    <div class="modal-content" style="text-align: left;">
      <h2 style="color:var(--txt); margin-bottom: 20px;">Schedule Interview</h2>
      <div style="margin-bottom: 16px;">
        <label style="display:block; margin-bottom: 8px; color:var(--txt2);">Select Topic</label>
        <select id="scheduleTopic" class="chat-input" style="width:100%; border-radius: 8px; background:var(--bg);">
          <option>System Design</option>
          <option>Data Structures & Algorithms</option>
          <option>Frontend Architecture</option>
          <option>Behavioral</option>
        </select>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:12px;">
        <button class="btn btn-outline" onclick="closeScheduleModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitSchedule()">Schedule</button>
      </div>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div id="feedbackModal" class="modal-overlay">
    <div class="modal-content" style="text-align: left; max-width: 700px; max-height: 80vh; display:flex; flex-direction:column;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 16px;">
        <h2 style="color:var(--txt); margin:0;">Interview Feedback</h2>
        <button onclick="closeFeedbackModal()" style="background:none; border:none; color:var(--txt2); cursor:pointer;"><i data-lucide="x"></i></button>
      </div>
      <div id="feedbackContent" style="overflow-y:auto; line-height:1.6; color:var(--txt2); white-space:pre-wrap;">
        Loading...
      </div>
    </div>
  </div>

</body>
</html>
